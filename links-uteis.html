<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Links Úteis — Noeds</title>
<link rel="icon" href="assets/logo-noeds.jpeg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #0b0b0b;
    --card: #141414;
    --border: #242424;
    --primary: #8aff45;
    --primary-foreground: #0b0b0b;
    --foreground: #f0ecd8;
    --muted-foreground: #8a8a82;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--foreground);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* a página inteira é o widget: fica ancorado no canto inferior direito do iframe */
  .widget {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    z-index: 999999;
  }

  .panel {
    width: 272px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55);
    display: none;
    flex-direction: column;
    gap: 14px;
    animation: rise .22s cubic-bezier(.2,.9,.3,1);
  }
  .panel.open { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

  .featured {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(138, 255, 69, 0.08);
    border: 1px solid rgba(138, 255, 69, 0.3);
    border-radius: 12px;
    padding: 13px 14px;
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .featured:hover { background: rgba(138, 255, 69, 0.14); border-color: rgba(138, 255, 69, 0.5); }
  .featured-icon {
    flex-shrink: 0;
    width: 34px; height: 34px;
    border-radius: 9px;
    background: rgba(138, 255, 69, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .featured-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--primary);
  }

  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin: 0 0 2px;
  }

  .links { display: flex; flex-direction: column; gap: 2px; }
  .link-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 6px;
    border-radius: 9px;
    text-decoration: none;
    color: var(--foreground);
    font-size: 13.5px;
    font-weight: 500;
    transition: background .15s;
  }
  .link-item:hover { background: rgba(255,255,255,0.05); }
  .link-icon { flex-shrink: 0; display: flex; }

  .fab {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(138, 255, 69, 0.35);
    transition: transform .15s;
  }
  .fab:hover { transform: scale(1.05); }
  .fab:active { transform: scale(0.96); }
  .fab svg { transition: opacity .15s, transform .2s; }
  .fab .icon-close { display: none; }
  .fab.open .icon-chat { display: none; }
  .fab.open .icon-close { display: block; }
</style>
</head>
<body>

<div class="widget">
  <div id="panel" class="panel">
    <a class="featured" href="https://monaiaraujo27-rgb.github.io/noeds-pages/checklist.html" target="_top">
      <span class="featured-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8aff45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span class="featured-text">Tutoriais e<br/>Documentação</span>
    </a>

    <div>
      <p class="section-label">Links úteis</p>
      <div class="links">
        <a class="link-item" href="#" target="_blank" rel="noopener noreferrer">
          <span class="link-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8aff45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
          Grupo de Avisos
        </a>
        <a class="link-item" href="https://monaiaraujo27-rgb.github.io/noeds-pages/comunidade.html" target="_top">
          <span class="link-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8aff45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          Comunidade
        </a>
        <a class="link-item" href="https://wa.me/5532987199347?text=Preciso%20de%20suporte%20da%20Noeds" target="_blank" rel="noopener noreferrer">
          <span class="link-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8aff45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></span>
          Suporte
        </a>
      </div>
    </div>
  </div>

  <button id="fab" class="fab" aria-label="Abrir links úteis">
    <svg class="icon-chat" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b0b0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
</div>

<script>
  const fab = document.getElementById('fab');
  const panel = document.getElementById('panel');
  fab.addEventListener('click', () => {
    const open = panel.classList.toggle('open');
    fab.classList.toggle('open', open);
    fab.setAttribute('aria-label', open ? 'Fechar links úteis' : 'Abrir links úteis');
  });
</script>

</body>
</html>
